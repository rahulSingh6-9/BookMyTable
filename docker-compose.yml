services:
  backend:
    build:
      context: ./Bookmytable-Backend
    container_name: bookmytable-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Bookmytable-Backend/.env
    volumes:
      - ./Bookmytable-Backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped
    command: npm run dev

  web-frontend:
    build:
      context: ./Bookmytable-Frontend/web
    container_name: web-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Bookmytable-Frontend/web:/app
      - web_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    command: npm run dev

  admin-frontend:
    build:
      context: ./Bookmytable-Frontend/admin
    container_name: admin-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./Bookmytable-Frontend/admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    command: npm run dev

volumes:
  backend_node_modules:
  web_node_modules:
  admin_node_modules:

networks:
  default:
    driver: bridge